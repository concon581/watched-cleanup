name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -v

      - name: Build
        run: CGO_ENABLED=0 go build -o watched-cleanup .

      - name: Docker build
        run: docker build -t watched-cleanup:ci .
